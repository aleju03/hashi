[workspace]
resolver = "2"
members = ["helper", "src-tauri"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"

# the song's decoding and the game size window's drawing are too slow unoptimized to try out
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
