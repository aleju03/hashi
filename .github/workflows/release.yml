name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            # no space: github turns those into dots
            assets: Hashi-Setup[ext]
          # the oldest supported ubuntu, so the appimage runs on older systems too
          - os: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi

      - name: linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      # builds lazer-writer/, which saves into lazer skins. lazer's .NET runs it, not this one
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: tauri-apps/tauri-action@v0
        env:
          HASHI_LAZER_WRITER: required
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # pinned: src-tauri/windows/installer.nsi is this version's template with changes
          tauriScript: npx --yes @tauri-apps/cli@2.12.1
          args: --bundles ${{ matrix.bundles }}
          assetNamePattern: ${{ matrix.assets }}
          tagName: v__VERSION__
          releaseName: Hashi v__VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          includeUpdaterJson: true

      # proof the files were built here from this commit. free on public repos only
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
