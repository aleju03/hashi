[package]
name = "mania-bridge"
description = "Hashi"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = { version = "0.3", default-features = false }
mania-bridge-helper = { path = "../helper" }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-updater = "2"
png = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
ab_glyph = "0.2"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.18"
pollster = "1"
wgpu = "30"
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", default-features = false }
webview2-com = "0.39"
windows-core = "0.62"
windows-registry = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
